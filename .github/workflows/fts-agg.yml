name: fts-agg
on:
  push:
    paths:
      - '.github/workflows/fts-agg.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sd/file-sql
          fetch-depth: 0
      - name: Reset to official 5bce9e0 and apply FTS agg tree
        run: |
          git reset --hard 5bce9e06d1281347ad61344e4b01fab9158c58a2
          curl -fsSL -o /tmp/fts-agg.diff https://raw.githubusercontent.com/Sunny1004-7/seekdb/sd/fts-tune/fts-agg.diff
          git apply --check /tmp/fts-agg.diff
          git apply /tmp/fts-agg.diff
          git config user.name "1xiaosongshu"
          git config user.email "13831588003@139.com"
          git checkout -b sd/fts-agg
          git add -A
          git commit -m "perf(fts): clean base + C3/C1/C1b + IK decode once"
          git push origin sd/fts-agg
          echo "FINAL_TREE=$(git rev-parse HEAD^{tree})"
